! Cisco IOS-XE device administration via ISE TACACS+ — the OTHER half of ISE.
! RADIUS controls who gets on the NETWORK; TACACS+ controls who can log into the GEAR
! and which commands they can run. Needs ISE Device Admin licenses + a TACACS+ profile
! and command set on the ISE side.

tacacs server ISE-TACACS
 address ipv4 0.0.0.0
 key <tacacs-shared-secret>
!
aaa group server tacacs+ ISE-TAC
 server name ISE-TACACS
 ip tacacs source-interface Vlan10
!
! ALWAYS chain 'local' as a fallback. If ISE is unreachable and you have no local
! method, you are locked out of your own switch — ask me how I know.
aaa authentication login VTY group ISE-TAC local
aaa authorization exec VTY group ISE-TAC local
aaa authorization commands 15 VTY group ISE-TAC local
aaa accounting commands 15 VTY start-stop group ISE-TAC
!
username breakglass privilege 15 secret <local-fallback>   ! the lifeboat
!
line vty 0 4
 login authentication VTY
 authorization exec VTY
 authorization commands 15 VTY
 accounting commands 15 VTY
 transport input ssh
!
! Prove it with a second session open BEFORE you trust it:
!   test aaa group ISE-TAC <user> <pass> legacy
