! Cisco IOS-XE NAD: 802.1X + MAB to ISE, IBNS 2.0, with CoA.
! Start WITHOUT 'access-session closed' (open/monitor mode); flip to closed once proven.

radius server ISE-1
 address ipv4 0.0.0.0 auth-port 1812 acct-port 1813
 key <shared-secret>
!
aaa group server radius ISE
 server name ISE-1
 ip radius source-interface Vlan10
!
aaa server radius dynamic-author        ! CoA: ISE can quarantine a live session
 client 0.0.0.0 server-key <shared-secret>
!
aaa authentication dot1x default group ISE
aaa authorization network default group ISE
aaa accounting dot1x default start-stop group ISE
dot1x system-auth-control
!
policy-map type control subscriber DOT1X_MAB
 event session-started match-all
  10 class always do-all
   10 authenticate using dot1x priority 10
   20 authenticate using mab priority 20
!
interface GigabitEthernet1/0/10
 switchport access vlan 10
 switchport mode access
 access-session host-mode multi-auth
 access-session port-control auto
 ! access-session closed                 ! enable ONLY after monitor mode proves policy
 dot1x pae authenticator
 service-policy type control subscriber DOT1X_MAB
