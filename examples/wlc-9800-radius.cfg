! Cisco Catalyst 9800 WLC as a RADIUS NAD to ISE: 802.1X WLAN with CoA.
! The wireless side of NAC. Same ISE, same shared secret model as the wired switch,
! but the policy/CoA plumbing lives in a policy profile, not on the interface.

radius server ISE-1
 address ipv4 0.0.0.0 auth-port 1812 acct-port 1813
 key <shared-secret>
 automate-tester username probe-user probe-on   ! proactively mark the server dead/alive
!
aaa group server radius ISE
 server name ISE-1
!
aaa authentication dot1x ISE-DOT1X group ISE
aaa authorization network ISE-DOT1X group ISE
aaa accounting identity ISE-DOT1X start-stop group ISE
!
aaa server radius dynamic-author                ! CoA: ISE can re-auth or quarantine a live client
 client 0.0.0.0 server-key <shared-secret>
!
dot1x system-auth-control
!
wlan corp-secure 1 corp-secure
 security dot1x authentication-list ISE-DOT1X
 no shutdown
!
! The policy profile is where ISE gets to drive the session: AAA override lets ISE push
! VLAN/dACL per user, and 'nac' enables RADIUS CoA so a posture/quarantine change lands live.
wireless profile policy CORP-POLICY
 aaa-override
 nac
 vlan VLAN_50
 no shutdown
!
wireless tag policy CORP-TAG
 wlan corp-secure policy CORP-POLICY
!
! Verify the path before blaming policy:
!   test aaa group ISE <user> <pass> new-code
!   show wireless client summary
